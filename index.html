<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>シンカリオン とけいマスター！</title>
    <!-- 外部のCSSファイルを正しく読み込みます -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- 音声トグルボタン -->
        <button id="sound-toggle">🔊</button>

        <!-- ① TOP画面 -->
        <div id="screen-top" class="screen">
            <button id="start-btn">スタート</button>
        </div>

        <!-- ② マップ画面 -->
        <div id="screen-map" class="screen" style="display: none;">
            <div id="stage-nav">
                <button class="nav-arrow" id="prev-stage">&lt;</button>
                <span id="stage-title">ステージ 1</span>
                <button class="nav-arrow" id="next-stage">&gt;</button>
            </div>
            <button id="menu-btn">メニュー</button>
            <div id="map-nodes"></div>
            <div id="map-toast"></div>
            <div id="stage-intro">
                <div id="stage-intro-text"></div>
            </div>
        </div>

        <!-- 司令室画面 (キャラクター選択) -->
        <div id="shireishitsu-overlay">
            <div id="shireishitsu-box">
                <div id="commander-intro">
                    <div id="commander-face"></div>
                    <div class="speech-bubble">出撃するシンカリオンと運転士を選んでくれ！</div>
                </div>
                <div id="character-grid"></div>
                <div id="character-preview-area">
                    <div id="character-preview-img"></div>
                    <div id="character-preview-info">
                        <div id="character-preview-name">キャラ名</div>
                        <div class="profile-row"><span class="p-label">機体</span><span class="p-colon">:</span><span id="p-val-mecha">--</span></div>
                        <div class="profile-row"><span class="p-label">しんぶん</span><span class="p-colon">:</span><span id="p-val-cv">--</span></div>
                    </div>
                    <div id="character-preview-pilot"></div>
                </div>
                <button id="sortie-btn">しゅつげきする</button>
                <button class="back-btn" id="shireishitsu-back">もどる</button>
            </div>
        </div>

        <!-- ③ バトル画面 -->
        <div id="screen-battle" class="screen" style="display: none;">
            <div id="player"></div>
            <div id="enemy"></div>

            <div id="clock-area">
                <div id="clock-face">
                    <canvas class="hand-canvas" id="hand-canvas"></canvas>
                </div>
            </div>

            <div id="ui-panel-left">
                <div class="badge-row">
                    <div class="badge" id="score-badge">たおしたてき: 0</div>
                </div>
                <button id="back-to-map-btn">マップへ</button>
            </div>

            <div id="ui-panel-right">
                <div class="hp-container">
                    <span class="hp-label" style="color:#38bdf8;">PLAYER</span>
                    <div class="hp-bar" id="player-hp-bar"></div>
                </div>
                <div class="hp-container">
                    <span class="hp-label" style="color:#ef4444;">ENEMY</span>
                    <div class="hp-bar" id="enemy-hp-bar"></div>
                </div>
                <!-- クリティカルタイマーバー -->
                <div id="critical-timer-container">
                    <div id="critical-timer-bar"></div>
                </div>
            </div>

            <!-- クリティカルヒット カットイン演出 -->
            <div id="critical-cutin">
                <div id="critical-cutin-image"></div>
                <div class="cutin-text">クリティカルヒット！</div>
            </div>

            <!-- バトル中セリフポップアップ演出 -->
            <div id="battle-pilot-speech">
                <div id="battle-pilot-face"></div>
                <div id="battle-pilot-bubble">セリフ</div>
            </div>

            <div id="bottom-panel">
                <div class="time-panel">
                    <div class="time-block">
                        <div class="stepper-row">
                            <button class="step-btn" id="hour-up">▲</button>
                            <div class="digital-display hour-color" id="display-hour">12</div>
                            <button class="step-btn" id="hour-down">▼</button>
                        </div>
                        <div class="unit-label unit-hour">じ (時)</div>
                    </div>
                    <div class="colon">:</div>
                    <div class="time-block">
                        <div class="stepper-row">
                            <button class="step-btn" id="min-up10">▲</button>
                            <div class="digital-display minute-color" id="display-min">00</div>
                            <button class="step-btn" id="min-down10">▼</button>
                        </div>
                        <div class="unit-label unit-minute">ふん (分)</div>
                    </div>
                </div>
                <button id="decide-btn">こうげきする</button>
            </div>

            <div id="message-overlay"></div>
        </div>

        <!-- メニューやステージ選択のポップアップ -->
        <div id="menu-overlay">
            <div class="popup-box">
                <h2>メニュー</h2>
                <button class="btn-secondary" id="menu-close">とじる</button>
            </div>
        </div>

        <div id="node-popup">
            <div class="popup-box">
                <h2 id="node-popup-title">ステージ</h2>
                <button class="btn-primary" id="node-popup-battle">バトル開始</button>
                <button class="btn-secondary" id="node-popup-close">キャンセル</button>
            </div>
        </div>

        <!-- ローディング画面 -->
        <div id="loading-overlay">
            <div class="loading-box">
                <div class="loading-spinner"></div>
                <div id="loading-text">よみこみ中...</div>
            </div>
        </div>
    </div>

    <!-- 外部のJavaScriptファイルを読み込みます -->
    <script src="game.js"></script>
</body>
</html>
