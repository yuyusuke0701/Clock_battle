<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>しんかんせん クロックマスター</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ゲーム全体を包むコンテナ（固定サイズを等倍拡大縮小） -->
    <div id="game-container">

        <!-- トップ画面 -->
        <div id="screen-top" class="screen" style="display: flex;">
            <div class="top-title">しんかんせん<br>クロックマスター</div>
            <button class="big-btn" onclick="startGame()">ゲームスタート</button>
        </div>

        <!-- マップ画面 -->
        <div id="screen-map" class="screen" style="display: none;">
            <div id="stage-nav-header">
                <button id="prev-arrow" onclick="prevStage()">◀</button>
                <span id="stage-nav-label">ステージ 1</span>
                <button id="next-arrow" onclick="nextStage()">▶</button>
            </div>
            
            <div id="map-nodes">
                <!-- JavaScriptでノードが動的生成されます -->
            </div>

            <div id="stage-intro" class="stage-intro">
                <div id="stage-intro-text">ステージ 1</div>
            </div>

            <div id="map-toast" class="map-toast" style="display: none;"></div>
        </div>

        <!-- バトル画面 -->
        <div id="screen-battle" class="screen" style="display: none;">
            <div class="battle-header">
                <div id="stage-text">ステージ1-1</div>
                <div class="hp-container">
                    <span class="hp-label">味方:</span>
                    <div id="player-hp" class="hp-bars"></div>
                </div>
                <div class="hp-container">
                    <span class="hp-label">敵:</span>
                    <div id="enemy-hp" class="hp-bars"></div>
                </div>
            </div>

            <!-- 【追加】10秒クリティカルタイマーのバー -->
            <div id="critical-timer-container">
                <div id="critical-timer-bar"></div>
            </div>

            <div class="battle-arena">
                <div id="player" class="battle-chara"></div>
                <div id="vs-label">VS</div>
                <div id="enemy" class="battle-chara"></div>
            </div>

            <!-- 時計エリア -->
            <div class="clock-area">
                <div class="clock-frame">
                    <canvas id="handCanvas" width="330" height="330"></canvas>
                </div>
            </div>

            <!-- 操作・解答エリア -->
            <div class="control-area">
                <div class="time-adjusters">
                    <div class="adjuster-group">
                        <span class="adjuster-title">じかん (1-12)</span>
                        <div class="adjuster-buttons">
                            <button onclick="changeHour(-1)">-</button>
                            <span id="hour-display" class="time-text">03</span>
                            <button onclick="changeHour(1)">+</button>
                        </div>
                    </div>
                    <div class="adjuster-group">
                        <span class="adjuster-title">ふん (00/30)</span>
                        <div class="adjuster-buttons" style="width: 100%;">
                            <button onclick="changeMinute()" style="width: 100%;" id="minute-display">00</button>
                        </div>
                    </div>
                </div>
                <button class="decide-btn" onclick="checkAnswer()">けってい！</button>
            </div>

            <button class="back-map-btn" onclick="backToMap()">マップへもどる</button>
        </div>

    </div>

    <!-- メニューボタン（常時表示用など） -->
    <button id="menu-btn" onclick="openMenu()" style="display: none;">⚙️</button>

    <!-- メニューオーバーレイ -->
    <div id="menu-overlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>メニュー</h2>
            <button class="menu-action-btn" onclick="openShireishitsu()">しれいしつ（キャラクター変更）</button>
            <button class="menu-action-btn" onclick="closeMenu()">とじる</button>
        </div>
    </div>

    <!-- しれいしつオーバーレイ -->
    <div id="shireishitsu-overlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>しれいしつ</h2>
            <p>しゅっつうする しんかんせんを えらんでね</p>
            <div id="character-list" class="character-list">
                <!-- キャラクターカードが動的生成されます -->
            </div>
            <button class="menu-action-btn" onclick="closeShireishitsu()">もどる</button>
        </div>
    </div>

    <!-- ノード確認ポップアップ -->
    <div id="node-popup" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2 id="node-popup-title">バトルポイント 1</h2>
            <p>このバトルに チャレンジしますか？</p>
            <div class="popup-btns">
                <button class="menu-action-btn" onclick="confirmBattleStart()">しゅっつう！</button>
                <button class="menu-action-btn" onclick="closeNodePopup()">やめる</button>
            </div>
        </div>
    </div>

    <!-- メッセージオーバーレイ -->
    <div id="message-overlay" class="message-overlay"></div>

    <!-- サウンド切替ボタン -->
    <button id="sound-toggle" onclick="toggleSound()">🔊</button>

    <!-- 【追加・修正】クリティカル発動時のカットイン演出用レイヤー（上半身50%トリミング対応） -->
    <div id="critical-cutin">
        <div class="cutin-content">
            <div class="cutin-img-wrapper">
                <img id="cutin-chara-img" src="" alt="Critical Chara">
            </div>
            <div class="cutin-text">CRITICAL!</div>
        </div>
    </div>

    <!-- ゲームロジックの読み込み -->
    <script src="game.js"></script>
</body>
</html>
